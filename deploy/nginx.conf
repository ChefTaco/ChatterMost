map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 80;
  server_name __TAILSCALE_HOST__;
  if ($host != __TAILSCALE_HOST__) { return 421; }
  return 301 https://__TAILSCALE_HOST__:__TLS_PORT__$request_uri;
}

server {
  listen __TLS_PORT__ ssl http2;
  server_name __TAILSCALE_HOST__;
  if ($host != __TAILSCALE_HOST__) { return 421; }

  ssl_certificate /var/lib/tailscale/certs/__TAILSCALE_HOST__.crt;
  ssl_certificate_key /var/lib/tailscale/certs/__TAILSCALE_HOST__.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;

  client_max_body_size 30m;

  location /api/v4/websocket {
    proxy_pass http://127.0.0.1:__APP_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://127.0.0.1:__APP_PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
