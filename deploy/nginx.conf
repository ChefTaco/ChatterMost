map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

# One address may hold this many requests and sockets open at once. The application keeps
# its own per-address budgets; this stops a flood before it reaches the single app process.
limit_conn_zone $binary_remote_addr zone=chattermost_conn:10m;

server {
  listen 80;
  server_name __TAILSCALE_HOST__;
  if ($host != __TAILSCALE_HOST__) { return 421; }
  return 301 https://__TAILSCALE_HOST__:__TLS_PORT__$request_uri;
}

server {
  listen __TLS_PORT__ ssl http2;
  server_name __TAILSCALE_HOST__;
  if ($host != __TAILSCALE_HOST__) { return 421; }

  ssl_certificate /var/lib/tailscale/certs/__TAILSCALE_HOST__.crt;
  ssl_certificate_key /var/lib/tailscale/certs/__TAILSCALE_HOST__.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header Strict-Transport-Security "max-age=31536000" always;

  server_tokens off;
  client_max_body_size 30m;
  client_header_timeout 15s;
  client_body_timeout 30s;
  limit_conn chattermost_conn 200;
  limit_conn_status 429;

  location /api/v4/websocket {
    proxy_pass http://127.0.0.1:__APP_PORT__;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    # Without these the client's own X-Forwarded-For would reach the app from a trusted
    # proxy address and be believed, letting it pick the address its sockets count against.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location / {
    proxy_pass http://127.0.0.1:__APP_PORT__;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
}
