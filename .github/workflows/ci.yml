name: ci

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      DATABASE_URL: postgresql://chattermost_ci:ci-postgres-password@localhost:55432/chattermost?schema=public
      SHADOW_DATABASE_URL: postgresql://chattermost_ci:ci-postgres-password@localhost:55432/chattermost_shadow?schema=public
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: chattermost_ci
          POSTGRES_PASSWORD: ci-postgres-password
          POSTGRES_DB: chattermost
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U chattermost_ci -d chattermost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run privacy:check
      - run: npm run privacy:test
      - run: npm run container:test
      - name: Verify actual Docker build context privacy
        run: python3 tests/container/context.py
      - run: npx prisma validate
      - name: Create disposable shadow database
        run: |
          PGPASSWORD=ci-postgres-password psql -h localhost -p 55432 -U chattermost_ci -d chattermost -v ON_ERROR_STOP=1 -c 'CREATE DATABASE chattermost_shadow'
      - run: npx prisma migrate diff --from-schema-datamodel prisma/schema.prisma --to-migrations prisma/migrations --shadow-database-url "$SHADOW_DATABASE_URL" --exit-code
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
