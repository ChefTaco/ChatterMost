name: container-release
on:
  push:
    tags: ['v0.*']
permissions:
  contents: read
concurrency:
  group: container-release
  cancel-in-progress: false
jobs:
  gates:
    uses: ./.github/workflows/ci.yml
  preflight:
    needs: gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - name: Validate every declared upgrade source before building or publishing
        run: python3 tests/container/lifecycle.py "${GITHUB_REF_NAME#v}" --plan
      - name: Refuse overwriting published version
        # Read-only job token: this check needs no package or release write access.
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; select a new version.' >&2; exit 1
          fi
  native:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24.22.3, cache: npm}
      - run: npm ci
      - uses: docker/setup-buildx-action@v4
      - name: Native execution identity
        run: uname -m
      - name: Set immutable version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "CREATED=$(git log -1 --format=%cI)" >> "$GITHUB_ENV"
      - name: Refuse reuse of a native image version
        env:
          ARCH: ${{ matrix.arch }}
        run: python3 distribution/check-image-version.py "$VERSION-$ARCH"
      - name: Build application
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          load: true
          tags: chattermost-local:release
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
            CREATED=${{ env.CREATED }}
      - name: Build migration image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: migrator
          load: true
          tags: chattermost-migrator-local:release
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
            CREATED=${{ env.CREATED }}
      - name: Scan application
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: chattermost-local:release
          format: json
          output: scan-app-${{ matrix.arch }}.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Scan migrator
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: chattermost-migrator-local:release
          format: json
          output: scan-migrator-${{ matrix.arch }}.json
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Exercise native installation before publishing
        run: python3 tests/container/native.py "$VERSION"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish native application with SBOM and provenance
        id: publish_app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: runtime
          push: true
          tags: ghcr.io/cheftaco/chattermost:${{ env.VERSION }}-${{ matrix.arch }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
            CREATED=${{ env.CREATED }}
      - name: Publish native migrator with SBOM and provenance
        id: publish_migrator
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile
          target: migrator
          push: true
          tags: ghcr.io/cheftaco/chattermost-migrator:${{ env.VERSION }}-${{ matrix.arch }}
          sbom: true
          provenance: mode=max
          build-args: |
            VERSION=${{ env.VERSION }}
            REVISION=${{ github.sha }}
            CREATED=${{ env.CREATED }}
      - name: Record the native candidate digests
        env:
          ARCH: ${{ matrix.arch }}
          APP_DIGEST: ${{ steps.publish_app.outputs.digest }}
          MIGRATOR_DIGEST: ${{ steps.publish_migrator.outputs.digest }}
        run: |
          python3 - <<'PY'
          import json, os, re
          record = {'version': os.environ['VERSION'], 'arch': os.environ['ARCH'], 'app_digest': os.environ['APP_DIGEST'], 'migrator_digest': os.environ['MIGRATOR_DIGEST']}
          assert all(re.fullmatch(r'sha256:[a-f0-9]{64}', record[k]) for k in ('app_digest', 'migrator_digest')), 'Missing candidate digest'
          with open(f"candidate-{record['arch']}.json", 'w') as file:
              json.dump(record, file)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: candidate-${{ matrix.arch }}
          path: candidate-${{ matrix.arch }}.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: scans-${{ matrix.arch }}
          path: scan-*.json
  lifecycle:
    # Separate from the publishing job: no registry login and a read-only token.
    needs: native
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24.22.3, cache: npm}
      - run: npm ci
      - name: Native execution identity
        run: uname -m
      - name: Set immutable version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: candidate-${{ matrix.arch }}
      - name: Confirm the published candidate tags are the recorded digests
        id: candidate
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          version, arch = os.environ['VERSION'], os.environ['ARCH']
          record = json.load(open(f'candidate-{arch}.json'))
          assert (record['version'], record['arch']) == (version, arch), 'Candidate record is for another build'
          outputs = []
          for name, key in (('chattermost', 'app_digest'), ('chattermost-migrator', 'migrator_digest')):
              # Anonymous: the image packages are public.
              digest = subprocess.run(['docker', 'buildx', 'imagetools', 'inspect', f'ghcr.io/cheftaco/{name}:{version}-{arch}', '--format', '{{.Manifest.Digest}}'], check=True, stdout=subprocess.PIPE, text=True).stdout.strip()
              assert digest == record[key], f'{name}:{version}-{arch} does not resolve to the digest the native job pushed'
              outputs.append(f'{key}={digest}\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as file:
              file.writelines(outputs)
          PY
      - name: Provide release metadata for every declared upgrade source
        if: ${{ !startsWith(env.VERSION, '0.2.') }}
        # The only step with a token, the job's read-only one. The test step below
        # gets the responses as files and runs without any credential.
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          METADATA="$RUNNER_TEMP/release-metadata"
          mkdir -m 700 "$METADATA"
          SOURCES="$(python3 tests/container/lifecycle.py "$VERSION" --plan)"
          for SOURCE in $(python3 -c 'import json, sys; print(" ".join(json.loads(sys.argv[1])))' "$SOURCES"); do
            gh api "repos/ChefTaco/ChatterMost/releases/tags/v$SOURCE" > "$METADATA/v$SOURCE.json"
          done
          echo "CHATTERMOST_GITHUB_RELEASE_METADATA=$METADATA" >> "$GITHUB_ENV"
      - name: Install native browser for lifecycle proof
        if: ${{ !startsWith(env.VERSION, '0.2.') }}
        run: npx playwright install --with-deps chromium
      - name: Exercise every declared published baseline against the native candidate
        if: ${{ !startsWith(env.VERSION, '0.2.') }}
        env:
          CHATTERMOST_LIFECYCLE_BROWSER: 'true'
          CHATTERMOST_LIFECYCLE_REPORT: lifecycle-proof-${{ matrix.arch }}.json
          APP_DIGEST: ${{ steps.candidate.outputs.app_digest }}
          MIGRATOR_DIGEST: ${{ steps.candidate.outputs.migrator_digest }}
        run: python3 tests/container/lifecycle.py "$VERSION" "$APP_DIGEST" "$MIGRATOR_DIGEST"
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(env.VERSION, '0.2.') }}
        with:
          name: scans-lifecycle-${{ matrix.arch }}
          path: lifecycle-proof-${{ matrix.arch }}.json
          if-no-files-found: error
  publish:
    needs: [native, lifecycle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: 24.22.3, cache: npm}
      - run: npm ci
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish immutable multi-platform manifests and bundle
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo 'Release already exists; select a new version.' >&2; exit 1
          fi
          python3 distribution/check-image-version.py "$VERSION"
          for NAME in chattermost chattermost-migrator; do
            docker buildx imagetools create -t "ghcr.io/cheftaco/$NAME:$VERSION" "ghcr.io/cheftaco/$NAME:$VERSION-amd64" "ghcr.io/cheftaco/$NAME:$VERSION-arm64"
          done
          APP_DIGEST="$(docker buildx imagetools inspect "ghcr.io/cheftaco/chattermost:$VERSION" --format '{{.Manifest.Digest}}')"
          MIGRATOR_DIGEST="$(docker buildx imagetools inspect "ghcr.io/cheftaco/chattermost-migrator:$VERSION" --format '{{.Manifest.Digest}}')"
          python3 distribution/package.py "$VERSION" "$APP_DIGEST" "$MIGRATOR_DIGEST" public-release
      - uses: actions/download-artifact@v4
        with:
          pattern: scans-*
          path: public-release/scans
          merge-multiple: true
      - name: Bind every public artifact with checksums
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('public-release')
          files = list(root.glob('*.tar.gz')) + [root / name for name in ('release.json', 'compose.yaml', 'chattermost')] + list((root / 'scans').glob('*.json'))
          (root / 'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in sorted(files)))
          PY
      - name: Attest release archive
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            public-release/*.tar.gz
            public-release/SHA256SUMS
      - name: Publish release artifacts
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release create "$GITHUB_REF_NAME" public-release/*.tar.gz public-release/SHA256SUMS public-release/release.json public-release/compose.yaml public-release/chattermost public-release/scans/*.json --title "ChatterMost ${GITHUB_REF_NAME#v}" --notes 'Mattermost-compatible container distribution. Digest-pinned AMD64 and ARM64 images, Compose installation bundle, integrity checksums, vulnerability scans, SBOM and provenance. See the installation guide in the bundle.'
